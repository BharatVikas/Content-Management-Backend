name: Content Management Backend

on:
  push:
    branches:
      - main  # Trigger on pushes to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: SSH into EC2 and deploy
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Start Docker
            sudo systemctl start docker

            # Deployment directory
            DEPLOY_DIR="/home/ec2-user/backend"

            # Remove old repo completely
            rm -rf $DEPLOY_DIR
            mkdir -p $DEPLOY_DIR
            cd $DEPLOY_DIR

            # Clone the backend repo fresh
            git clone https://github.com/BharatVikas/Content-Management-Backend.git .

            # Stop & remove old container if exists
            sudo docker stop backend-app || true
            sudo docker rm backend-app || true
            sudo docker rmi backend-app || true

            # Build new Docker image
            sudo docker build -t backend-app .

            # Free port 8080 if already used
            sudo fuser -k 8080/tcp || true

            # Run new container on port 8080
            sudo docker run -d -p 8080:8080 --name backend-app backend-app
